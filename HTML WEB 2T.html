<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Cartão de Apresentação</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #080bd4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .cartao {
            width: 400px;
            padding: 30px;
            background-color: #ba0f0f;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(255, 255, 255, 0.15);
        }

        .etiqueta {
            color: #0507b1;
            font-size: 16px;
        }

        h1 {
            font-size: 32px;
            margin: 15px 0;
        }

        .descricao {
            color: #f0eff5;
            line-height: 1.5;
        }

        h2 {
            margin-top: 25px;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            margin: 8px;
        }
    </style>
</head>

<body>

    <div class="cartao">

        <p class="etiqueta">Olá, eu sou</p>

        <h1>brunna raphaella</h1>

        <p class="descricao">
            Gosto de bolo
        </p>

        <h2>Meus interesses</h2>

        <ul>
            <li>Programação</li>
            <li>Música</li>
            <li>Fazer Bolo</li>
        </ul>

    </div>

</body>
</html>
